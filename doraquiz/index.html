<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#007AFF" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="DoraQuiz" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>DoraQuiz クイズ</title>
<style>
:root{--ink:#222;--dim:#8a8a8e;--blue:#007AFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;color:var(--ink);background:#FAFAFA}
.app{max-width:760px;margin:0 auto;padding:18px 20px 30px}
h1{font-size:clamp(24px,5vw,30px);text-align:center;margin:8px 0 18px}
.card{background:#fff;border-radius:15px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px;margin-bottom:20px}
.card .label{text-align:center;font-weight:700;font-size:17px;margin-bottom:12px}
.seg{display:flex;background:#EFEFF4;border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:17px;font-weight:700;padding:10px;border-radius:9px;cursor:pointer;color:var(--ink)}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.genre-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;font:inherit;font-size:20px;font-weight:800;color:#fff;padding:19px;border-radius:20px;cursor:pointer;margin-bottom:16px;box-shadow:0 4px 10px rgba(0,0,0,.18)}
.genre-btn:active{transform:scale(.98)}
.genre-btn .cnt{font-size:13px;font-weight:700;opacity:.85}
.genre-btn.dark{color:#3a3000}
.remain{text-align:center;color:var(--dim);font-size:13px;margin-top:2px}
.topbar{display:flex;align-items:center;gap:8px;padding:4px 0 8px}
.back{border:0;background:transparent;font:inherit;font-size:17px;font-weight:700;cursor:pointer;padding:8px 4px}
.timer{margin:0 auto;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.08);padding:8px 12px;border-radius:10px}
.score{font-size:17px;font-weight:700;min-width:86px;text-align:right}
.qcount{text-align:center;color:var(--dim);font-size:13px;font-weight:700}
.char{font-size:80px;text-align:center;line-height:1.25;margin:6px 0 10px}
.qtext{background:#fff;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:22px 18px;font-size:20px;font-weight:700;text-align:center;line-height:1.55;margin-bottom:24px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:12px;padding:0 8px}
.opt{border:1.5px solid;background:#fff;font:inherit;font-size:17px;font-weight:700;padding:16px;border-radius:12px;cursor:pointer;text-align:center}
.opt:active{transform:scale(.98)}
.blur{filter:blur(5px)}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:50;padding:18px}
.overlay.show{display:flex}
.sheet{background:#fff;border-radius:25px;max-width:460px;width:100%;padding:30px 24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.sheet .emo{font-size:80px;line-height:1.2}
.sheet .msg{font-size:18px;font-weight:700;line-height:1.6;white-space:pre-wrap;margin:12px 0 4px}
.bigbtn{border:0;font:inherit;font-size:17px;font-weight:800;color:#fff;background:var(--blue);padding:15px 20px;width:170px;max-width:100%;border-radius:12px;cursor:pointer;margin-top:16px}
.bigbtn.green{background:#34C759}.bigbtn.orange{background:#FF9500}
.result-title{font-size:30px;font-weight:900;line-height:1.35}
.result-title.perfect{color:#FF9500;font-size:clamp(24px,6vw,32px)}
#restOverlay{background:#fff;z-index:100}
#restOverlay .sheet{box-shadow:none;max-width:560px}
.rest-title{font-size:clamp(26px,6vw,34px);font-weight:900}
.rest-sub{font-size:21px;margin-top:14px}
.rest-eyes{font-size:80px;margin:14px 0}
.rest-left{font-size:40px;font-weight:900;color:#FF3B30;font-variant-numeric:tabular-nums}
.progress{height:14px;background:#EFEFF4;border-radius:99px;overflow:hidden;margin:22px 10px 0}
.progress > div{height:100%;background:#32ADE6;border-radius:99px;transition:width .3s linear}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60;display:none}
.confetti.show{display:block}
.confetti i{position:absolute;top:-24px;display:block;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <!-- menu -->
  <section id="menuView">
    <h1>どのクイズであそぶ？</h1>
    <div class="card">
      <div class="label">あそぶ時間をえらんでね</div>
      <div class="seg" id="timeSeg">
        <button type="button" data-min="15">15分</button>
        <button type="button" data-min="30">30分</button>
        <button type="button" data-min="60">60分</button>
      </div>
    </div>
    <div id="genreList"></div>
    <div class="remain" id="menuRemain"></div>
  </section>

  <!-- quiz -->
  <section id="quizView" class="hidden">
    <div id="quizInner">
      <div class="topbar">
        <button class="back" id="backBtn" type="button">‹ もどる</button>
        <div class="timer" id="quizTimer"></div>
        <div class="score" id="scoreLabel">スコア: 0</div>
      </div>
      <div class="qcount" id="qCount"></div>
      <div class="char" id="charEmoji">🐱</div>
      <div class="qtext" id="qText"></div>
      <div class="opts" id="optList"></div>
    </div>
  </section>
</div>

<!-- feedback -->
<div class="overlay" id="feedbackOverlay">
  <div class="sheet">
    <div class="emo" id="fbEmoji">💮</div>
    <div class="msg" id="fbText">正解！</div>
    <button class="bigbtn" id="nextBtn" type="button">つぎへ</button>
  </div>
</div>

<!-- result -->
<div class="overlay" id="resultOverlay">
  <div class="sheet">
    <div class="result-title" id="resultTitle">🎉 おわり 🎉</div>
    <div class="msg" id="resultText"></div>
    <button class="bigbtn green" id="toMenuBtn" type="button">メニューへ戻る</button>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<!-- rest -->
<div class="overlay" id="restOverlay">
  <div class="sheet">
    <div class="rest-title">🍵 きゅうけいタイム 🍵</div>
    <div class="rest-sub">iPadを おいて、めを やすめよう！</div>
    <div class="rest-eyes">👀</div>
    <div style="color:var(--dim)">あとどのくらい？</div>
    <div class="rest-left" id="restLeft">10分 0秒</div>
    <div class="progress"><div id="restBar" style="width:100%"></div></div>
  </div>
</div>

<script>
"use strict";
const GENRES = [{"id": "doraemon", "name": "ドラえもん", "color": "#007AFF", "icon": "🐱", "count": 190}, {"id": "conan", "name": "名探偵コナン", "color": "#003380", "icon": "⚽️", "count": 186}, {"id": "pokemon", "name": "ポケモン", "color": "#FFCC00", "icon": "⚡️", "count": 204}, {"id": "history", "name": "戦国時代・歴史", "color": "#FF9500", "icon": "🏯", "count": 195}, {"id": "social", "name": "社会（小学生）", "color": "#34C759", "icon": "🗺️", "count": 202}, {"id": "science", "name": "理科（小学生）", "color": "#AF52DE", "icon": "🧪", "count": 193}, {"id": "math", "name": "算数（小学生）", "color": "#FF3B30", "icon": "🔢", "count": 186}, {"id": "japanese", "name": "国語（小学生）", "color": "#FF6482", "icon": "📖", "count": 188}, {"id": "english", "name": "英語（小学生）", "color": "#32ADE6", "icon": "🔤", "count": 194}];
const BANK = {"doraemon":[{"text":"ドラえもんの誕生日はいつ？","options":["9月3日","12月25日","8月7日","1月1日"],"answerIndex":0},{"text":"のび太くんの誕生日は？","options":["5月5日","8月7日","10月10日","3月3日"],"answerIndex":1},{"text":"ドラえもんの身長は何センチ？","options":["100cm","129.3cm","150cm","120.5cm"],"answerIndex":1},{"text":"ドラえもんの体重は何キロ？","options":["50kg","129.3kg","100kg","80kg"],"answerIndex":1},{"text":"ドラえもんは元々何色だった？","options":["青色","赤色","黄色","白色"],"answerIndex":2},{"text":"ドラえもんに耳がない理由は？","options":["喧嘩したから","ネズミにかじられたから","最初からなかった","忘れてきたから"],"answerIndex":1},{"text":"ドラミちゃんの好物は？","options":["どら焼き","メロンパン","おにぎり","クッキー"],"answerIndex":1},{"text":"ジャイアンの妹の名前は？","options":["ジャイ子","ジャイ美","ドラ美","のび子"],"answerIndex":0},{"text":"しずかちゃんが一番好きな食べ物は？","options":["クッキー","焼き芋","パンケーキ","お寿司"],"answerIndex":1},{"text":"どこにでも行けるドアの名前は？","options":["魔法のドア","どこでもドア","お散歩ドア","あちこちドア"],"answerIndex":1},{"text":"頭に乗せて空を飛ぶ道具は？","options":["タケコプター","プロペラくん","空飛ぶ帽子","ヘリコプター"],"answerIndex":0},{"text":"食べた内容を暗記できるパンは？","options":["天才パン","暗記パン","ノートパン","文字パン"],"answerIndex":1},{"text":"ドラえもんのパワーはいくつ？","options":["100馬力","129.3馬力","1000馬力","12.93馬力"],"answerIndex":1},{"text":"ドラえもんが製造された工場の名前は？","options":["松芝ロボット工場","未来ロボット製作所","22世紀製作所","マツシバ・メカニカル"],"answerIndex":0},{"text":"ドラえもんの製造番号は？","options":["MS-903","DR-001","DORA-1293","CAT-2112"],"answerIndex":0},{"text":"タケコプターの初期の名前は何だった？","options":["ヘリトンボ","タケプロペラ","ソラトブタケ","プロペラくん"],"answerIndex":0},{"text":"タイムふろしきの裏の色（未来にする方）は何色？","options":["赤","青","緑","黄色"],"answerIndex":1},{"text":"のび太がテストで100点をとった回数は？","options":["1回","2回","3回","0回"],"answerIndex":0},{"text":"ジャイアンの本名・剛田武の由来は？","options":["強いから","お父さんの名前","ジャイ子の本名予定だった","作者の名前"],"answerIndex":2},{"text":"しずかちゃんが飼っている小鳥の名前は？","options":["ピー子","チッチ","カナリヤ","ポー"],"answerIndex":1},{"text":"ドラえもんの足は地面から何ミリ浮いている？","options":["3mm","1cm","浮いていない","5mm"],"answerIndex":0},{"text":"のび太が無人島に家出した時、何年間過ごした？","options":["10日間","1年間","10年間","30年間"],"answerIndex":2},{"text":"ドラえもんの指の数は？","options":["5本","3本","0本","1本"],"answerIndex":2},{"text":"スネ夫の弟、スネツグは現在どこに住んでいる？","options":["ニューヨーク","ロンドン","パリ","ブラジル"],"answerIndex":0},{"text":"翻訳こんにゃくには味がある？","options":["ある","ない","苦い","甘い"],"answerIndex":0},{"text":"ジャイアンが飼っている犬の名前は？","options":["ムク","ペロ","ポチ","チロ"],"answerIndex":0},{"text":"ドラえもんの鼻の色は？","options":["青","黒","赤","黄色"],"answerIndex":2},{"text":"ドラえもんのヒゲは何本？","options":["4本","6本","8本","10本"],"answerIndex":1},{"text":"しずかちゃんが将来なりたかった職業の一つは？","options":["外交官","客室乗務員","料理人","ピアニスト"],"answerIndex":1},{"text":"スネ夫の苗字は？","options":["剛田","野比","骨川","源"],"answerIndex":2},{"text":"ドラえもんのモデルになったのは何？","options":["おきあがりこぼしと猫","パンダ","雪だるま","狸"],"answerIndex":0},{"text":"もしもボックスの中の電話、誰につながる？","options":["ドラえもん","もしも魔王","未来の警察","自分"],"answerIndex":1},{"text":"ドラえもんのしっぽを引っ張ると初期はどうなった？","options":["姿が消える","機能が停止する","空を飛ぶ","色が赤くなる"],"answerIndex":0},{"text":"ドラえもんが一番最初に使った道具は？","options":["タケコプター","どこでもドア","タイムマシン","なし"],"answerIndex":2},{"text":"ドラえもんの名をひらがなカタカナ混じりで書いたのは？","options":["作者","ドラえもん自身","22世紀の役所","のび太"],"answerIndex":1},{"text":"のび太の家の間取りは？","options":["3DK","2K","4LDK","1R"],"answerIndex":0},{"text":"ジャイアンの歌のファンクラブ会員番号1番は誰？","options":["スネ夫","のび太","しずかちゃん","自分"],"answerIndex":0},{"text":"しずかちゃんの名字は？","options":["源","骨川","春日","秋山"],"answerIndex":0},{"text":"出木杉くんの下の名前は？","options":["太郎","英才","健一","和也"],"answerIndex":1},{"text":"ドラえもんが22世紀で付き合っていた彼女の名前は？","options":["ノラミャー子","ミーちゃん","ドラ美","ルリィ"],"answerIndex":0},{"text":"ドラえもんの苦手な季節は？","options":["夏","冬","春","秋"],"answerIndex":1},{"text":"のび太の特技といえば「あやとり」とあと一つは何？","options":["射撃","水泳","書道","サッカー"],"answerIndex":0},{"text":"ジャイアンが作った、恐ろしい料理の名前は？","options":["地獄鍋","ジャイアンシチュー","魔界定食","剛田スープ"],"answerIndex":1},{"text":"スネ夫のパパの職業は何？","options":["社長","弁護士","医者","警察官"],"answerIndex":0},{"text":"のび太のママの名前は何？","options":["玉子","梅子","松子","竹子"],"answerIndex":0},{"text":"のび太のパパの名前は何？","options":["のび助","のび太郎","のび三","のび一"],"answerIndex":0},{"text":"ドラえもんのポケットの中身は何次元？","options":["三次元","四次元","五次元","二次元"],"answerIndex":1},{"text":"スネ夫の家で飼っている猫の名前は？","options": const CHARACTERS = ["🐱","👓","🛀","🎤","💇‍♂️","🎀","🏯","⚔️"];
const QUESTIONS_PER_ROUND = 20;
const REST_MS = 10*60*1000;
const LS = { minutes:"doraquiz.v1.minutes", playEndsAt:"doraquiz.v1.playEndsAt", restEndsAt:"doraquiz.v1.restEndsAt" };

let playMinutes = parseInt(localStorage.getItem(LS.minutes) || "30", 10);
if (![15,30,60].includes(playMinutes)) playMinutes = 30;
let genre = null, questions = [], qIndex = 0, score = 0, busy = false;

const $ = (id) => document.getElementById(id);
const menuView=$("menuView"), quizView=$("quizView");

/* ---------- sounds (Web Audio) ---------- */
let audioCtx = null;
function beep(freq, start, dur, type){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    const t = audioCtx.currentTime + start;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type||"sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
const soundCorrect = () => { beep(880,0,.14); beep(1318,.12,.22); };
const soundWrong   = () => { beep(220,0,.25,"square"); };
const soundFanfare = () => { [523,659,784,1046].forEach((f,i)=>beep(f,i*.13,.25)); };

/* ---------- timers (end-timestamp based, survives reload) ---------- */
function playEndsAt(){ const v = parseInt(localStorage.getItem(LS.playEndsAt)||"0",10); return v||0; }
function restEndsAt(){ const v = parseInt(localStorage.getItem(LS.restEndsAt)||"0",10); return v||0; }
function startPlayTimer(){
  if (playEndsAt() > Date.now()) return; // already running (original behaviour)
  localStorage.setItem(LS.playEndsAt, String(Date.now() + playMinutes*60*1000));
}
function startRest(){
  if (restEndsAt() > Date.now()) return;
  localStorage.removeItem(LS.playEndsAt);
  localStorage.setItem(LS.restEndsAt, String(Date.now() + REST_MS));
}
function fmtMin(ms){ return Math.max(0, Math.ceil(ms/60000)); }
function tick(){
  const now = Date.now();
  const rEnd = restEndsAt();
  if (rEnd) {
    if (now < rEnd) {
      const left = rEnd - now;
      $("restLeft").textContent = Math.floor(left/60000) + "分 " + Math.floor(left%60000/1000) + "秒";
      $("restBar").style.width = (left/REST_MS*100) + "%";
      $("restOverlay").classList.add("show");
      return;
    }
    localStorage.removeItem(LS.restEndsAt); // rest finished
  }
  $("restOverlay").classList.remove("show");
  const pEnd = playEndsAt();
  if (pEnd) {
    if (now >= pEnd) { startRest(); tick(); return; }
    const label = "あと " + fmtMin(pEnd-now) + "分";
    $("quizTimer").textContent = label;
    $("menuRemain").textContent = "のこり時間: " + fmtMin(pEnd-now) + "分";
  } else {
    $("quizTimer").textContent = "";
    $("menuRemain").textContent = "";
  }
}
setInterval(tick, 250);

/* ---------- menu ---------- */
function renderTimeSeg(){
  document.querySelectorAll("#timeSeg button").forEach(b=>{
    b.classList.toggle("on", parseInt(b.dataset.min,10)===playMinutes);
    b.onclick = ()=>{ playMinutes = parseInt(b.dataset.min,10); localStorage.setItem(LS.minutes,String(playMinutes)); renderTimeSeg(); };
  });
}
function renderGenres(){
  const list = $("genreList"); list.innerHTML = "";
  GENRES.forEach(g=>{
    const btn = document.createElement("button");
    btn.type="button"; btn.className="genre-btn" + (g.id==="pokemon" ? " dark" : "");
    btn.style.background = g.color;
    btn.innerHTML = "";
    const s1=document.createElement("span"); s1.textContent=g.icon;
    const s2=document.createElement("span"); s2.textContent=g.name;
    const s3=document.createElement("span"); s3.className="cnt"; s3.textContent=g.count+"問";
    btn.append(s1,s2,s3);
    btn.onclick = ()=> startQuiz(g);
    list.appendChild(btn);
  });
}

/* ---------- quiz ---------- */
function shuffle(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
function startQuiz(g){
  if (restEndsAt() > Date.now()) { tick(); return; }
  startPlayTimer();
  genre = g;
  questions = shuffle(BANK[g.id]||[]).slice(0, QUESTIONS_PER_ROUND);
  qIndex = 0; score = 0; busy = false;
  menuView.classList.add("hidden"); quizView.classList.remove("hidden");
  renderQuestion(); tick();
}
function renderQuestion(){
  const q = questions[qIndex]; if(!q) return;
  $("charEmoji").textContent = CHARACTERS[Math.floor(Math.random()*CHARACTERS.length)];
  $("scoreLabel").textContent = "スコア: " + score;
  $("qCount").textContent = "もんだい " + (qIndex+1) + " / " + questions.length;
  $("qText").textContent = q.text;
  const list = $("optList"); list.innerHTML = "";
  q.options.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.type="button"; b.className="opt"; b.style.borderColor=genre.color; b.style.color=genre.color;
    b.textContent=opt;
    b.onclick=()=>checkAnswer(i);
    list.appendChild(b);
  });
}
function checkAnswer(i){
  if (busy || restEndsAt() > Date.now()) return;
  const q = questions[qIndex]; busy = true;
  const correct = i === q.answerIndex;
  if (correct) { score++; soundCorrect(); $("fbEmoji").textContent="💮"; $("fbText").textContent="正解！"; }
  else { soundWrong(); $("fbEmoji").textContent="🤔"; $("fbText").textContent="ざんねん！\n正解は「"+q.options[q.answerIndex]+"」だよ。"; }
  $("scoreLabel").textContent = "スコア: " + score;
  $("quizInner").classList.add("blur");
  $("feedbackOverlay").classList.add("show");
}
$("nextBtn").onclick = ()=>{
  $("feedbackOverlay").classList.remove("show");
  $("quizInner").classList.remove("blur");
  busy = false;
  if (qIndex < questions.length-1) { qIndex++; renderQuestion(); }
  else showResult();
};
function showResult(){
  const total = questions.length, perfect = score===total && total>0;
  const btn = $("toMenuBtn");
  if (perfect) {
    $("resultTitle").textContent = "🌟 ぜんもんせいかい！ 🌟";
    $("resultTitle").className = "result-title perfect";
    $("resultText").textContent = "きみは クイズ王だね！";
    btn.className = "bigbtn orange";
    soundFanfare(); launchConfetti();
  } else {
    $("resultTitle").textContent = "🎉 おわり 🎉";
    $("resultTitle").className = "result-title";
    $("resultText").textContent = total + "問中 " + score + "問 正解！";
    btn.className = "bigbtn green";
  }
  $("quizInner").classList.add("blur");
  $("resultOverlay").classList.add("show");
}
$("toMenuBtn").onclick = ()=>{
  $("resultOverlay").classList.remove("show");
  $("quizInner").classList.remove("blur");
  $("confetti").classList.remove("show"); $("confetti").innerHTML="";
  genre=null; questions=[];
  quizView.classList.add("hidden"); menuView.classList.remove("hidden");
  tick();
};
$("backBtn").onclick = ()=>{
  genre=null; questions=[];
  quizView.classList.add("hidden"); menuView.classList.remove("hidden");
  tick();
};
function launchConfetti(){
  const box = $("confetti"); box.innerHTML="";
  const colors=["#FF3B30","#007AFF","#34C759","#FFCC00","#FF6482","#FF9500","#AF52DE"];
  for(let i=0;i<50;i++){
    const el=document.createElement("i");
    const size=8+Math.random()*8;
    el.style.left=(Math.random()*100)+"vw";
    el.style.width=size+"px"; el.style.height=size+"px";
    el.style.background=colors[i%colors.length];
    el.style.animationDuration=(2+Math.random()*2)+"s";
    el.style.animationDelay=(Math.random()*1.5)+"s";
    box.appendChild(el);
  }
  box.classList.add("show");
  setTimeout(()=>{ box.classList.remove("show"); box.innerHTML=""; }, 6000);
}

/* ---------- PWA ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tick(); });

renderTimeSeg(); renderGenres(); tick();
</script>
